[alembic]
# Percorso delle migration, relativo a questo file.
script_location = alembic

# Antepone la cwd a sys.path: permette a env.py di fare "import app.*"
# quando alembic viene lanciato da services/identity/ (dove vive app/).
prepend_sys_path = .

# Naming convention dei file di migration: <revisione>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# Timezone per i timestamp embeddati nei nomi/commenti delle revision.
timezone = UTC

# sqlalchemy.url NON e' valorizzato qui di proposito: env.py legge
# DATABASE_URL da app.config.get_settings() (stessa fonte di verita'
# usata dall'app a runtime, .env incluso) invece che duplicarlo qui.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
