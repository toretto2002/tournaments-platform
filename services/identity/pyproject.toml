[project]
name = "identity"
version = "0.1.0"
description = "Servizio identity - utenti, ruoli, autenticazione"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "sqlalchemy[asyncio]==2.*",
    "asyncpg==0.30.*",
    "alembic==1.*",
    "aiokafka==0.14.*",
    "httpx==0.28.*",
    "argon2-cffi==23.*",
    "pyjwt==2.*",
    "cryptography>=42,<46",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "ruff==0.8.*",
    "mypy==1.*",
]

[tool.uv]
# App, non libreria: non c'e' un package "identity" da buildare/installare,
# il codice vive in app/ e gira con uvicorn. Dice a uv di gestire solo le
# dipendenze senza provare a costruire/installare il progetto stesso.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
